<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2834"/>
      <stop offset="0.45" stop-color="#10161d"/>
      <stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f7fb"/>
      <stop offset="0.4" stop-color="#6bd6f0"/>
      <stop offset="1" stop-color="#2b7d91"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="36%" r="50%">
      <stop offset="0" stop-color="#6bd6f0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#10161d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ivory" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fff8ea"/>
      <stop offset="0.5" stop-color="#e4d2ae"/>
      <stop offset="1" stop-color="#9d8860"/>
    </linearGradient>
    <linearGradient id="ivoryHi" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#d4c094"/>
    </linearGradient>
    <linearGradient id="ebony" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7d8ea3"/>
      <stop offset="0.42" stop-color="#3a4758"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ebonyHi" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#c5d2e2"/>
      <stop offset="1" stop-color="#4b5a6c"/>
    </linearGradient>
    <linearGradient id="sqL" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#e6dcc8"/>
      <stop offset="1" stop-color="#b9ad96"/>
    </linearGradient>
    <linearGradient id="sqD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33404e"/>
      <stop offset="1" stop-color="#1a2129"/>
    </linearGradient>
    <linearGradient id="wood" x1="0.2" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#3c2c20"/>
      <stop offset="1" stop-color="#16100c"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="0.45" stop-color="#6bd6f0"/>
      <stop offset="1" stop-color="#2a7a8c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="plateClip">
      <rect x="36" y="36" width="440" height="440" rx="112"/>
    </clipPath>
  </defs>

  <rect x="36" y="36" width="440" height="440" rx="112" fill="url(#plate)"/>
  <rect x="36" y="36" width="440" height="440" rx="112" fill="url(#glow)"/>
  <rect x="44" y="44" width="424" height="424" rx="104" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <rect x="62" y="62" width="388" height="388" rx="92" fill="none" stroke="#6bd6f0" stroke-opacity="0.15" stroke-width="2"/>

  <g clip-path="url(#plateClip)">
    <g transform="translate(256 438) scale(1.18) translate(-256 -400)">
      <polygon points="102,382 278,454 278,468 102,396" fill="url(#wood)"/>
      <polygon points="278,454 410,400 410,414 278,468" fill="#0e0b09"/>
      <polygon points="234,328 410,400 278,454 102,382" fill="#12181e"/>
      <polygon points="234,328 278,346 234,364 190,346" fill="url(#sqL)"/>
      <polygon points="278,346 322,364 278,382 234,364" fill="url(#sqD)"/>
      <polygon points="322,364 366,382 322,400 278,382" fill="#6bd6f0" fill-opacity="0.62"/>
      <polygon points="366,382 410,400 366,418 322,400" fill="url(#sqD)"/>
      <polygon points="190,346 234,364 190,382 146,364" fill="url(#sqD)"/>
      <polygon points="234,364 278,382 234,400 190,382" fill="url(#sqL)"/>
      <polygon points="278,382 322,400 278,418 234,400" fill="url(#sqD)"/>
      <polygon points="322,400 366,418 322,436 278,418" fill="url(#sqL)"/>
      <polygon points="146,364 190,382 146,400 102,382" fill="url(#sqL)"/>
      <polygon points="190,382 234,400 190,418 146,400" fill="url(#sqD)"/>
      <polygon points="234,400 278,418 234,436 190,418" fill="url(#sqL)"/>
      <polygon points="278,418 322,436 278,454 234,436" fill="url(#sqD)"/>
      <polygon points="322,364 366,382 322,400 278,382" fill="none" stroke="#d7f8ff" stroke-width="2.2"/>
      <polyline points="102,382 278,454 410,400" fill="none" stroke="#6bd6f0" stroke-opacity="0.4" stroke-width="2"/>
    </g>
  </g>

  <!-- Ivory man (front-left stacked disc) -->
  <g transform="translate(168 318)" filter="url(#soft)">
    <ellipse cx="0" cy="58" rx="78" ry="18" fill="#05070a" opacity="0.38"/>
    <ellipse cx="0" cy="36" rx="74" ry="22" fill="#8a7654"/>
    <ellipse cx="0" cy="22" rx="74" ry="24" fill="url(#ivory)"/>
    <ellipse cx="0" cy="8" rx="68" ry="20" fill="url(#ivoryHi)"/>
    <ellipse cx="0" cy="8" rx="28" ry="9" fill="none" stroke="#6bd6f0" stroke-opacity="0.35" stroke-width="3"/>
    <ellipse cx="-18" cy="-2" rx="22" ry="8" fill="#fff" opacity="0.28"/>
  </g>

  <!-- Ebony king: two stacked discs + cyan crown -->
  <g transform="translate(332 248)" filter="url(#soft)">
    <ellipse cx="0" cy="96" rx="82" ry="18" fill="#05070a" opacity="0.42"/>
    <ellipse cx="0" cy="72" rx="76" ry="22" fill="#0d1116"/>
    <ellipse cx="0" cy="58" rx="76" ry="24" fill="url(#ebony)"/>
    <ellipse cx="0" cy="44" rx="70" ry="20" fill="url(#ebonyHi)"/>
    <ellipse cx="0" cy="28" rx="70" ry="22" fill="url(#ebony)"/>
    <ellipse cx="0" cy="14" rx="64" ry="18" fill="url(#ebonyHi)"/>
    <ellipse cx="0" cy="14" rx="26" ry="8" fill="none" stroke="#6bd6f0" stroke-opacity="0.45" stroke-width="3"/>
    <path fill="url(#crown)" d="M-36,-8 L-22,-40 L-8,-14 L0,-48 L8,-14 L22,-40 L36,-8 Z"/>
    <rect x="-38" y="-12" width="76" height="10" rx="3" fill="url(#crown)"/>
    <circle cx="-22" cy="-40" r="5" fill="#e8fbff"/>
    <circle cx="0" cy="-48" r="6" fill="#8ae6f6"/>
    <circle cx="22" cy="-40" r="5" fill="#e8fbff"/>
  </g>
</svg>
